[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logicgrid"
version = "0.1.0"
description = "Generator, solver and difficulty rater for Penny Dell-style logic grid puzzles, with LLM narrative round-trip verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew Best" }]
keywords = ["logic puzzle", "zebra puzzle", "einstein riddle", "constraint", "puzzle generator"]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
play = ["textual>=8.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "textual>=8.0", "textual-dev>=1.7"]

[project.scripts]
logicgrid = "logicgrid.cli:main"
logicgrid-play = "puzzleplay.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/logicgrid", "src/puzzleplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
