[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logicgrid"
version = "0.1.0"
description = "Generator, solver and difficulty rater for Penny Dell-style logic grid puzzles, with LLM narrative round-trip verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "logicgrid" }]
keywords = ["logic puzzle", "zebra puzzle", "einstein riddle", "constraint", "puzzle generator"]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
logicgrid = "logicgrid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/logicgrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
